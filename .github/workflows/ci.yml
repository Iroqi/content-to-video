name: CI

on:
  push:
    branches: [main, feature]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 采样而非全矩阵：下限（SKILL.md 声明的 3.9+）、一个中位、本机开发用的两档
        python: ["3.9", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # 脚本输出含中文；Windows runner 控制台默认 cp1252，直接 print 会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 可选依赖 Pillow 也装上：它让 _media_size 覆盖 AVIF/HEIC 等全部格式，
      # 少了它那几条用例只会走降级分支、测不到主路径。"缺 Pillow 仍能用"另有用例钉住。
      - name: Install optional deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt
        timeout-minutes: 3

      # 技能脚本只依赖标准库；Pillow 是可选的"多认几种图片格式"依赖
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        timeout-minutes: 5

      # 三道文档契约检查（cross-refs · numbers · examples）都是"文档与代码
      # 是否还诚实"的同一件事，并成一步；本地维护者跑法相同：
      #   check_docs   ——「指向哪」：章节交叉引用有没有悬空、文档有没有重新膨胀
      #   check_numbers——「是几」：文档里的数字必须等于代码常量（决策阈值最小集）
      #   check_examples——「能不能跑」：文档示例退化成"看起来对"的那天，读者要
      #                    自己再撞一遍当初试错撞出来的坑
      - name: Doc contracts
        run: |
          python tests/check_docs.py
          python tests/check_numbers.py
          python tests/check_examples.py
