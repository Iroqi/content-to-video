<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<script src="vendor/gsap.min.js"></script>
<style>
/* ── Content-to-Video composition stylesheet ──────────────────────────────
   本文件是版式的**静态骨架**：结构与选择器写死，数值一律走 var(--ctv-*)。
   变量由 html_renderer.py 从 _template.py 内联的版式数据派生后注入本文件末尾的
   :root 块。
   注意：注释里**不得写出占位符名字**——装配用的是全文替换，注释里的同名
   字符串也会被替换（会把整份变量表塞进注释里）。
   纪律：**版式数值**（随画幅/主题取不同值的几何与字号）在本文件内不得
   硬编码，一律走 --ctv-* 令牌、改版式只改 _template.py 内联的版式数据；
   与画幅无关、单值即终态的结构常数（1px 描边、em 相对字距、字重、mask
   渐隐百分比等）允许直接写在本文件里——给它们各配一枚令牌只会把一份
   JSON 变成两份。

   双画幅：竖屏 3:4 与横屏 16:9 共用同一批 --ctv-* 令牌键名（数值各取
   layout.vertical / layout.landscape 块）。画面结构与三档版式行为以
   references/rendering.md「画面结构」为准，这里不复述。
   ────────────────────────────────────────────────────────────────────── */

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--ctv-w);height:var(--ctv-h);overflow:hidden;background:var(--ctv-bg-gradient)}
/* local() 顺序即优先级：macOS/Windows 原名在前，Linux 沙箱只有
   "Noto Sans CJK SC/JP"（"Noto Sans SC" 会回落到无 CJK 字形的
   NotoSans-Regular.ttf），兜底名必须显式列出。 */
@font-face{font-family:"Microsoft YaHei";src:local("Microsoft YaHei"),local("MicrosoftYaHei"),local("Noto Sans CJK SC"),local("Noto Sans CJK JP")}
@font-face{font-family:"PingFang SC";src:local("PingFang SC"),local("PingFangSC"),local("Noto Sans CJK SC"),local("Noto Sans CJK JP")}
@font-face{font-family:"Noto Sans SC";src:local("Noto Sans SC"),local("NotoSansSC"),local("Noto Sans CJK SC"),local("Noto Sans CJK JP")}
/* 上面三枚是"字体栈里出现过的名字都要有 @font-face"：hyperframes 的
   StaticGuard 会把 font-family 里每个未在 @font-face / 自动解析字体表
   中出现的家族名判成 error（font_family_without_font_face），判定基于
   名字而不是解析结果——所以兜底名自身也必须声明，src 只用 local()，
   本机没有该字体时依旧按字体栈正常回落。 */
@font-face{font-family:"Noto Sans CJK SC";src:local("Noto Sans CJK SC"),local("NotoSansCJKsc-Regular")}
@font-face{font-family:"Noto Sans CJK JP";src:local("Noto Sans CJK JP"),local("NotoSansCJKjp-Regular")}
body{font-family:var(--ctv-font-family)}

.bg{position:absolute;inset:0;background:var(--ctv-bg-gradient)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--ctv-grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--ctv-grid-color) 1px,transparent 1px);background-size:var(--ctv-grid-size) var(--ctv-grid-size);-webkit-mask-image:radial-gradient(120% 95% at 50% 45%,transparent 28%,#000 82%);mask-image:radial-gradient(120% 95% at 50% 45%,transparent 28%,#000 82%)}

/* 段落氛围光：每段把自己的 accent 稀释成一团大半径径向光垫在内容之下
   （z-index:-1 + isolation 把它压在卡片内容之上、却仍在页面背景/网格之上），
   让不同段落各有色彩氛围，破除整片米白的单调。
   isolation 写在无属性限定的 .seg-card 上：两画幅都要它，且 hyperframes 的
   negative_z_index 检查只看静态声明、不解析 [data-aspect] 作用域，写成属性
   选择器会被误报成"祖先没有层叠上下文"。
   几何（椭圆半轴、圆心、浓度、截止点）随画幅变——竖屏那团居中且宽大于高，
   横屏偏媒体区中心且高大于宽——所以全部走 var(--ctv-amb-*)，值在
   _template.py 的 layout.<画幅>.ambience。**别在这里写死第二份**：改模板
   不会带着 CSS 里的字面量走。 */
.seg-card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(var(--ctv-amb-rx) var(--ctv-amb-ry) at var(--ctv-amb-cx) var(--ctv-amb-cy),color-mix(in srgb,var(--seg-accent) var(--ctv-amb-alpha),transparent),transparent var(--ctv-amb-edge))}
/* 纯文字 agenda 卡（opening/closing，与 .seg-card 同时挂在同一元素上）把圆心从媒体
   区拨回文字重心：横屏是 50% 45%，竖屏本来就是 50% 50%、与 .seg-card 相同。
   椭圆半轴/浓度/截止点两画幅共用，只圆心有第二种取值。注意这条**不带画幅限定**，
   两画幅都要命中，所以两个画幅的 agendaCx/agendaCy 都得填对——竖屏填错会静默
   把开场/收尾那两页的氛围光挪位。 */
.agenda-card::after{background:radial-gradient(var(--ctv-amb-rx) var(--ctv-amb-ry) at var(--ctv-amb-agenda-cx) var(--ctv-amb-agenda-cy),color-mix(in srgb,var(--seg-accent) var(--ctv-amb-alpha),transparent),transparent var(--ctv-amb-edge))}
/* 蘋果風開場（opening_animation:"apple"）的题头光晕：一枚放在标题身后的软光斑，
   模拟苹果发布会的"产品光"。径向渐变中心透、外缘淡出，所以压在哪一行文字上都
   不遮字；z-index:-1 衬在 agenda 列内容之下、卡片 .bg（-2）之上；透明度完全
   交给 GSAP 编排（淡入 + repeat:-1 呼吸），CSS 只负责形状与颜色。 */
.apple-halo{position:absolute;inset:0 0 42% 0;z-index:-1;pointer-events:none;background:radial-gradient(58% 92% at 50% 34%,color-mix(in srgb,var(--seg-accent) 34%,transparent),transparent 68%)}
.seg-card{position:absolute;inset:0;isolation:isolate}
/* 引导线（style:"line" 才生成）：进度条的续命——转场时这条 accent 高亮线从
   页底脱开向上扫，新页跟着它被画出来。它是新卡的末子，随父卡 clip-path 裁切，
   只露出揭示边以下的部分（GSAP 补间 y，自身不得声明 transform）；颜色走卡上
   已有的 --seg-accent，所以看起来是"下一页的颜色从进度条里渗出来"；两端渐隐、
   中心提亮成一枚"笔尖"，是硬条读不出笔触、必须有亮头才有"书写"感；辉光下偏
   （y 偏移）让光只洒在刚被画出的页面上——均匀四散是"发光条"，下洒才是"光源在画"。 */
.reveal-line{position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,transparent 0%,var(--seg-accent) 16%,color-mix(in srgb,var(--seg-accent) 55%,#fff) 50%,var(--seg-accent) 84%,transparent 100%);box-shadow:0 12px 30px 5px color-mix(in srgb,var(--seg-accent) 55%,transparent);pointer-events:none}
/* 被揭旧页的底缘暗边（style:"line" 且该页会被下一页犁起才生成）：绕底边轴
   掀起的纸在折页线附近最暗；opacity 由 peel 同窗补间拉起（_peel_shade_html）。 */
.peel-shade{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);opacity:0;pointer-events:none}
/* 卡内自带 .bg/.grid 背景层（几何沿用 root 那两条规则，逐像素对齐）：卡片由此
   成为不透明图层，clip-path 擦除换页时新旧内容不会叠影。z-index:-2 压在氛围光
   (::after,-1) 之下；负 z 的安全性与上面 isolation 的 lint 口径同判。 */
.seg-card>.bg,.seg-card>.grid{z-index:-2}
.seg-title-wrap{position:absolute}
.seg-title{font-weight:var(--ctv-title-weight);letter-spacing:var(--ctv-title-tracking);color:var(--ctv-text-color);line-height:var(--ctv-title-lh);word-break:break-word}
.tagline{font-size:var(--ctv-tagline-font);margin-top:var(--ctv-tagline-mt);line-height:var(--ctv-tagline-lh);font-weight:var(--ctv-tagline-weight);font-family:var(--ctv-font-mono);letter-spacing:.05em;padding-left:var(--ctv-tagline-indent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
/* 内容段 tagline 左侧的 accent 刻度条（落在 indent 留白里，不推挤文字）：
   两画幅同款故无属性限定，宽度走 --ctv-tagline-tick。开屏/结尾已是纯文字
   agenda 卡，不再出现 tagline。 */
.tagline::before{content:"";position:absolute;left:0;top:50%;width:var(--ctv-tagline-tick);height:1.15em;transform:translateY(-50%);border-radius:calc(var(--ctv-tagline-tick)/2);background:linear-gradient(180deg,var(--seg-accent),color-mix(in srgb,var(--seg-accent) 45%,transparent))}
.seg-progress{position:absolute;bottom:0;left:0;height:var(--ctv-prog-height);box-shadow:0 0 calc(var(--ctv-prog-height) * 3) color-mix(in srgb,var(--seg-accent) 60%,transparent)}
/* 进度条轨道：垫在 fill 之下的整宽低对比底轨（::before 先于子元素绘制，
   不会盖住 fill）。颜色走文字色 10% 混透明，双主题自适应、无新令牌。
   轨道几何与配色两画幅完全一致，故无属性限定——按 [data-aspect] 拆成两份
   只会多出一次同步维护，没有第二种取值可表达。 */
.seg-card::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--ctv-prog-height);background:color-mix(in srgb,var(--ctv-text-color) 10%,transparent)}
/* 槽位不铺底色，素材直接落在页面背景上。
   外发光从祖先 seg-card 注入的 --seg-accent 派生（半径走 --ctv-img-glow），
   两画幅同款、三个媒体分支共用一条，渲染器不再把颜色写进 inline style。 */
.seg-image{position:absolute;overflow:hidden;box-shadow:0 0 var(--ctv-img-glow) color-mix(in srgb,var(--seg-accent) 25%,transparent)}
/* img 与 video 共用同一套铺满规则：槽位是定盒 + overflow:hidden，缺了这条的话
   <video> 按固有尺寸摆（16:9 素材在 4:3 槽里既不满也不 cover，右边留空、
   下边被裁）。这条是**唯一**来源：inline style 会盖过一切非 important 选择器，
   所以渲染器不给 <video> 写 inline 铺满样式、竖屏也不挂 !important 副本——
   三处并存时改一处不生效。 */
.seg-image img,.seg-image video{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
/* 导演模式的内联 SVG（.svg-inline）：铺满槽位，和 <img>+object-fit:cover 同款。
   cover 语义由 SVG 根节点自带的 preserveAspectRatio="xMidYMid slice" 承担（净化时
   写入，见 _svg_sanitize），这里只负责把它撑到 100%×100%；z-index 与 img 一致，
   让内描边 ::after 照常收边（bare-media 时又被撤掉，与 <img> SVG 同路径）。 */
.seg-image.svg-inline>svg{position:relative;z-index:1;width:100%;height:100%;display:block}
/* 配图槽位统一的 1px accent 内描边（z 高于 img，压在图像之上收边），SVG 配图
   除外（见下面 bare-media）。两画幅同款故无属性限定；agenda 卡没有 .seg-image，不受影响。 */
.seg-image::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--seg-accent) 34%,transparent)}
/* 无框媒体（bare-media = SVG 配图）：撤掉上面那道内描边和外发光。画布透明时
   这两层是唯一还留着"矩形槽位"证据的东西，留着就是给一片空白画框。圆角刻意
   保留：没有底色和描边之后它只裁到图自身的留白，且省掉一条与 [data-aspect]
   圆角规则打架的选择器。 */
.seg-image.bare-media{box-shadow:none}
.bare-media::after{display:none}

/* ── Vertical（竖屏 3:4，1080x1440）大标题 + 图片 + 句子流 ──────────────
   仅在 #root[data-aspect="vertical"] 时命中。portrait（3:4）复用本块全部规则。
   竖屏只有 verse 模式。结构：固定标题区（1 行优先、最多 2 行）→ 固定 4:3 画布
   → 固定在底部的句子流。标题不参与画布与 verse 的定位。
   侧边距统一由 --ctv-v-pad-left 控制（标题/画布/句子流对齐同一轴线）。
   注意：本块全部是绝对定位——绝对定位子元素的包含块是 padding box，
   segCard 的 padding 不会内缩它们，轴线必须显式写成 left/right 值；
   同理百分比宽度按整屏 1080 解析而非内容盒宽，画布宽必须用变量
   --ctv-v-img-w（renderer 有护栏保证 image.width = 屏宽 − 2×pad）。
   本块刻意**不用 !important**：每条选择器都比 base 块多一个属性选择器
   （0,2,0 > 0,1,0），层叠自然压过 base；渲染器写在同名元素上的 inline
   style 只带 font-size / color / text-shadow / opacity，
   与本块声明的属性零重叠，没有需要靠 importance 才能赢的对手。 */
[data-aspect="vertical"] .seg-card{inset:0;padding:0 var(--ctv-v-pad-left) var(--ctv-v-pad-left)}
[data-aspect="vertical"] .seg-title-wrap{left:var(--ctv-v-pad-left);right:var(--ctv-v-pad-left);top:var(--ctv-v-title-top);height:var(--ctv-v-title-area);padding:0;overflow:hidden;text-align:left}
[data-aspect="vertical"] .seg-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--ctv-v-title-lines);overflow:hidden;max-height:calc(var(--ctv-v-title-lines) * var(--ctv-title-lh) * 1em)}
/* 横向居中走绝对定位的左右 auto 外边距，**不走 transform:translateX(-50%)**：
   GSAP 的入场补间往同一个元素写 inline transform，CSS 的 transform 与它互斥，
   写了就得靠 !important 压住补间、连带把 y 滑入整条吃掉（竖屏配图只剩淡入，
   横屏却有滑入）。用 auto 外边距居中，transform 归 GSAP 独占，两画幅动效一致。 */
[data-aspect="vertical"] .seg-image{top:var(--ctv-v-img-top);left:0;right:0;margin:0 auto;width:calc(var(--ctv-v-img-w) + var(--ctv-v-img-ms) * 2);height:var(--ctv-v-img-height);border-radius:var(--ctv-v-img-radius)}

/* ── verse 句子流（两画幅统一的双行窗口滚动字幕）────────────────────────
   竖屏 = 固定标题区/固定 4:3 画布 + 钉底句子流：窗口高由 vertical.verse.windowHeight
   控制，DOM 渲染在 seg-card 尾部、绝对定位钉在内容区底部（见下面的 vertical 覆盖）。
   横屏 = 左栏内的文档流窗口（base 规则相对定位即命中，无需额外覆盖）。
   开屏/结尾为 agenda 卡：其 .verse 收在 .agenda-col 列尾随流锚底（豁免规则在
   agenda 块）。
   clip 上下各留 verse.clipPad 内边距且滚动锚点同步同值：首句/尾句完整落在
   mask 渐隐区（上下各 14%）之外，不被边缘虚化。不变量：
   verse.clipPad ≥ 14% × verse.windowHeight（横屏 260→36.4、竖屏 280→39.2，
   两画幅 clipPad 均为 40）。 */
.verse{position:relative;width:100%;height:var(--ctv-verse-h);overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);
  mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
/* clip 必须定位：verse-line.offsetTop 需要相对 clip 而不是绝对定位的
   seg-card（否则首行 offsetTop 巨大，滚动公式恒被钳到段落尾部——
   第一句永远在窗口外） */
/* 这里刻意**不写 transition**：成片是逐帧 seek 时间线截出来的，每一帧的
   画面必须是"时间线时刻"的纯函数。CSS 过渡按墙上时钟走、不受 GSAP 驱动，
   实测（seek 到 12.0s 后立即读取计算样式）状态停在过渡起点：
   inline `translateY(-220px)` → computed `matrix(1,0,0,1,0,0)`、active 行
   opacity 0.62（该是 1）、颜色还是主题色而非 accent，6 条 CSSTransition
   全部 `playState:running, currentTime:0`。表现就是句子流不跟着滚动、
   高亮不上色——而且 bleed 多少取决于抓取每帧花多久，同一条稿件两次渲染
   不一致。预览要的那点淡入淡出由 preview.js 注入（只在人工预览分支）。 */
.verse-clip{position:relative;padding:var(--ctv-verse-clip) 0}
.verse-line{font-size:var(--ctv-sub-font);line-height:var(--ctv-verse-lh);font-weight:600;color:var(--ctv-text-color);opacity:.62;padding:var(--ctv-verse-line) 0;text-align:left;position:relative}
/* active/past 与 base 的 .verse-line 是 0,2,0 对 0,1,0，层叠自然压过，不用
   !important；运行时只往行上写 inline color，不写 opacity，没有对手。 */
.verse-line.active{opacity:1}
/* 活动行下划线：走 currentColor（runtime 把 accent 写在行上），从实到虚
   的横向渐变收在 62% 处，像荧光笔轻扫一道，替代单纯换色的弱提示 */
.verse-line.active::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--ctv-verse-line) * 0.4);height:var(--ctv-verse-rule);border-radius:calc(var(--ctv-verse-rule)/2);background:linear-gradient(90deg,color-mix(in srgb,currentColor 65%,transparent),transparent 62%)}
.verse-line.past{opacity:.45}
/* 对话段的说话人标签（只在轮次切换的首句行首出现，见 html_renderer._verse_html）。
   它是字幕里的**元信息**，不是内容：字号比句子小一档、字重压到最重、颜色走
   accent 的文本安全副本（--ctv-verse-who-color 由渲染器按段写在 .verse-clip 上，
   这里不存第二份色值）。小字号 + 重字重是为了让它读作"抬头"而不是"正文的
   前两个字"——只缩不重会跟正文糊在一起。
   不写 vertical-align：inline 元素默认基线对齐，且它自身 line-height 继承的
   数值（--ctv-verse-lh）× 更小的 font-size，算出来的行盒比 .verse-line 矮，
   不会把行撑高、不推动滚动锚点。 */
.verse-who{font-size:var(--ctv-verse-who-font);font-weight:800;color:var(--ctv-verse-who-color);margin-right:var(--ctv-verse-who-gap);white-space:nowrap}
/* 竖屏钉底。不用 !important：本条 0,2,0 压过上面的 .verse（0,1,0）；
   agenda 卡里的豁免由 .agenda-col .verse 用 importance 拿下（那两条选择器
   打平，靠 importance 而非源序决胜，理由见该处注释）。 */
[data-aspect="vertical"] .verse{position:absolute;left:var(--ctv-v-pad-left);right:var(--ctv-v-pad-left);bottom:var(--ctv-v-verse-bottom);width:auto;height:var(--ctv-verse-h);margin:0}

/* ── Landscape（横屏 16:9，1920x1080）左栏文本 + 右侧媒体卡 ─────────────
   仅在 #root[data-aspect="landscape"] 时命中。四周留白统一（--ctv-l-margin）、
   栏间距走 gap，左栏（标题组 + 句子流）垂直居中紧凑成块，媒体卡居右垂直居中。 */
[data-aspect="landscape"] .text-col{position:absolute;left:var(--ctv-l-margin);top:var(--ctv-l-margin);bottom:var(--ctv-l-margin);width:var(--ctv-l-text-w);display:flex;flex-direction:column;justify-content:center;gap:var(--ctv-l-text-gap)}
[data-aspect="landscape"] .seg-title-wrap{position:static}
/* 横屏标题**刻意不做行数钳制**（上面的 vertical 分支才有 -webkit-line-clamp）：
   左栏是垂直居中的 flex 列，长标题按 text-wrap:balance 自由折行，长度守卫只
   降字号（62→54→48）。因此 _template.py 的 landscape.title 里没有 maxLines，
   竖屏那份才有——给横屏补一个没人读的行数键，只会骗下一个改版式的人。 */
[data-aspect="landscape"] .seg-title{line-height:var(--ctv-l-title-lh);text-wrap:balance}
/* 媒体卡四周留 96 白、垂直居中。内描边与进度条轨道走两画幅共用的无属性限定
   规则（.seg-image::after / .seg-card::before），此处不再各写一份。 */

/* ── 整页画布（段落 layout: "canvas"，两画幅同一份）──────────────────────
   配图就是这一页：槽位盒拉满全屏，槽位那两道装饰（1px 内描边 + 外发光）一并
   撤掉——页面边缘就是画布边缘，再描一道等于给整块屏幕套相框。HTML 的标题层与
   句子流层由渲染器**不生成**（不是藏起来），所以画布上没有任何覆盖物，也就不
   需要遮罩层；文字对比度由画布自己负责（见 references/rendering.md）。
   选择器用 [data-aspect] 抬到 0,3,0，与两条画幅各自的 .seg-image 定位规则
   （0,2,0）打平源序无关地压过它们——同 agenda 豁免标题钳制的手法。 */
[data-aspect] .seg-canvas .seg-image{top:0;right:0;bottom:0;left:0;margin:0;width:100%;height:100%;border-radius:0;box-shadow:none}
[data-aspect] .seg-canvas .seg-image::after{display:none}
/* 画布页的氛围光要比槽位那枚**大得多、软得多**：画布页不画满幅底板，主题渐变 + 网格 +
   这团光就是它全部的景深来源。槽位那枚 58%×42% 的光斑放到整屏上只盖住中间一小块，
   边缘仍是平的，而且它的椭圆边界在深色页底上看得出来——读作糊在主视觉后面的一块色斑而不是
   打光。所以这里取近全屏的宽高、把中心略抬到主视觉一带、并把截止点推到 82% 让边界消失。
   抬到 0,3,1 与两条画幅各自的 .seg-card::after（0,2,1）无关源序地压过它们。
   网格不需要为画布降级：.grid 的 mask 本来就是中心透明、只在页缘显形，够不到图中间。 */
[data-aspect] .seg-card.seg-canvas::after{background:radial-gradient(var(--ctv-camb-rx) var(--ctv-camb-ry) at var(--ctv-camb-cx) var(--ctv-camb-cy),color-mix(in srgb,var(--seg-accent) var(--ctv-camb-alpha),transparent),transparent var(--ctv-camb-edge))}

   的 z-index:1 压着也看不出差别；画布拉满全屏后，一张铺到页底的照片就会把
   段进度整个盖掉。 */
[data-aspect] .seg-canvas .seg-progress,[data-aspect] .seg-canvas::before{z-index:2}

/* ── Agenda 卡（开屏/结尾，两画幅统一 DOM）───────────────────────────

   titleMarginTop 12"的紧行距换出来的，实测题头+7 行+定高句子流不挤）。代价是那一页

.agenda-head .seg-title{margin-top:var(--ctv-ag-title-mt);line-height:var(--ctv-ag-title-lh);text-wrap:balance}
/* agenda 正文列表既是生长块也是可牺牲块：行数没吃满 maxRows 预算时，

   （行距和"题头→首行"的间距一起拉开，不再把空白全堆到句子流上方）；
   行数超出时 min-height:0 解除 flex 默认不缩底、overflow:hidden 从尾部
   裁行。行距下限由 .agenda-row 自身的 rowPad 提供，所以满额预算时
   space-evenly 几乎无剩余可分，版式与改动前一致。

.agenda-tail{flex-shrink:0}
.agenda-row{display:flex;align-items:baseline;gap:var(--ctv-ag-gap);padding:var(--ctv-ag-row-pad) 4px;border-top:1px solid color-mix(in srgb,var(--ctv-text-color) 14%,transparent)}
.agenda-row:last-child{border-bottom:1px solid color-mix(in srgb,var(--ctv-text-color) 14%,transparent)}
.agenda-tail .agenda-row:first-child{border-top:0}
.ag-idx{font-family:var(--ctv-font-mono);font-size:var(--ctv-ag-idx);font-weight:700;min-width:var(--ctv-ag-idx-min);color:var(--seg-accent-text)}
/* 行名单行硬约束：折行会让行高翻倍、成倍吃掉定高列预算，超长直接省略号
   （Python 侧 nameTrim 已先按字数截断，这里兜住半角/混排的宽度偏差）。
   行高 1.4 = Noto Sans CJK Bold 实测墨迹下限（hyperframes 判 clipped_text 的
   阈值是墨迹 ≤ 行盒 − 2px，42px 时 1.32 仍超 3px、1.4 才装下）；微软雅黑在
   此行高下同样有余量，且两画幅 maxRows 预算都放得下（横屏 40px×1.4 的 7 行
   仍低于定高列预算）。1.25 时字形墨迹溢出被 overflow:hidden 裁掉。 */
.ag-name{font-size:var(--ctv-ag-name);font-weight:700;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-dur{margin-left:auto;font-family:var(--ctv-font-mono);font-size:var(--ctv-ag-dur);color:color-mix(in srgb,var(--ctv-text-color) 45%,transparent)}
/* agenda 内的句子流随 flex 列文档流锚底：豁免竖屏钉底绝对定位，但保留
   与内容段同高的定高窗口（--ctv-verse-h）与 mask 渐隐——height:auto 会让
   长旁白按句数无限撑高、吃掉整列预算，把行列表挤出屏幕；定高窗口 +
   运行时滚动锚点保证句子流占位恒定，挤压只落在可收缩的正文列表上。
   margin-top:auto 由句子流吸收列内剩余空间（题头/列表贴顶成块，留白
   全部沉到列表与句子流之间），挤压时 auto 归零、无副作用。
   这里的 !important 是**全表唯一承重的一处**：对手是句子流样式表里那条
   竖屏钉底规则，两条选择器同为 0,2,0 打平，靠源序决胜就等于把正确性押在
   那份样式表的注入位置上；用 importance 决胜与注入点无关。
   对面的规则因此不再需要 !important。 */
.agenda-col .verse{position:static!important;left:auto!important;right:auto!important;bottom:auto!important;width:100%!important;max-width:var(--ctv-ag-verse-w);margin:auto 0 0!important;flex-shrink:0}
/* agenda 标题整体豁免竖屏内容段标题钳制（-webkit-box / line-clamp /
   overflow:hidden / max-height 四件套）：agenda 卡是全高 flex 列、没有固定
   标题区，单行大标题不需要行数钳制，挂着 overflow:hidden 反而会把雅黑字体
   度量盒（≈1.32em）上下各约 9px 的溢出裁掉。豁免后长标题整段折行而非静默
   截断，垂直方向按 max(2px, 0.2em) 容差吸收字体度量溢出。
   不用 !important：本条 0,3,0 已经压过被豁免的 [data-aspect] .seg-title（0,2,0）。 */
[data-aspect="vertical"] .agenda-head .seg-title{display:block;overflow:visible;-webkit-line-clamp:none;max-height:none}

<script>
/* ── Composition 运行时：GSAP 时间线 + cue 数据 + verse 滚动 ──────────────
   动态片段由 html_renderer.py 填进本文件的占位符：逐段补间（数据驱动，由
   Python 生成）、逐句字幕 cue 数组（唯一时间轴来源）、verse 滚动锚点（= 当前
   画幅的 verse.clipPad）。
   注意：注释里**不得写出占位符名字**——装配用的是全文替换，注释里的同名
   字符串也会被替换（会把整段代码塞进注释，甚至因早闭注释破坏语法）。
   时钟只有一个：GSAP 时间线。渲染器逐帧 seek 触发 onUpdate。 */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
tl.fromTo("#opening",{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0% 0 0 0)",duration:0.40,ease:"power2.inOut"},0.00)
  tl.fromTo("#line-opening",{y:1080.0},{y:-6.0,duration:0.40,ease:"power2.inOut"},0.00)
  tl.from("#title-opening",{scale:0.5,duration:0.25,ease:"back.out(1.7)"},0.00)
  tl.to("#prog-opening",{width:"100%",duration:2.00,ease:"none"},0.00)
  tl.fromTo("#seg-a",{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0% 0 0 0)",duration:0.40,ease:"power2.inOut"},2.00)
  tl.fromTo("#line-seg-a",{y:1080.0},{y:-6.0,duration:0.40,ease:"power2.inOut"},2.00)
  tl.to("#opening",{y:-324.0,rotation:-4,rotationX:12,transformOrigin:"50% 100%",transformPerspective:1000,duration:0.40,ease:"power2.in"},2.00)
  tl.to("#shade-opening",{opacity:1,duration:0.40,ease:"power2.in"},2.00)
  tl.from("#title-seg-a",{scale:0.5,duration:0.50,ease:"back.out(1.7)"},2.40)
  tl.from("#img-seg-a",{opacity:0,y:40,duration:0.80,ease:"power2.out"},2.60)
  tl.to("#prog-seg-a",{width:"100%",duration:4.40,ease:"none"},2.40)
  tl.fromTo("#seg-b",{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0% 0 0 0)",duration:0.00,ease:"power2.inOut"},7.20)
  tl.to("#prog-seg-b",{width:"100%",duration:4.40,ease:"none"},7.20)
  tl.fromTo("#closing",{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0% 0 0 0)",duration:0.40,ease:"power2.inOut"},11.60)
  tl.fromTo("#line-closing",{y:1080.0},{y:-6.0,duration:0.40,ease:"power2.inOut"},11.60)
  tl.from("#title-closing",{scale:0.5,duration:0.25,ease:"back.out(1.7)"},12.00)
  tl.to("#prog-closing",{width:"100%",duration:2.00,ease:"none"},12.00)

// Sentence-flow sync via onUpdate
const cues = [
{t:0.00,d:2.40,si:0},
    {t:2.40,d:2.40,si:1},
    {t:4.80,d:2.40,si:2},
    {t:7.20,d:2.40,si:3},
    {t:9.60,d:2.40,si:4},
    {t:12.00,d:2.00,si:5}
];

// verse 句子流：静态行集合（两画幅内容段统一渲染 .verse，滚动/高亮
// 机制两画幅共用同一份 cue 驱动；横屏 clipPad 与窗口高取各自模板值）。
// 渲染器逐帧 seek 触发 onUpdate（非线性顺序），测量做懒缓存——布局值
// （offsetTop/clientHeight/scrollHeight）不受 transform 与 seek 顺序影响、
// 字体就绪后恒定，首帧测量一次即可；transform 赋绝对值幂等，乱序 seek
// 重复执行结果一致（seek-safe）。
const verses = Array.from(document.querySelectorAll(".verse"));
const verseCache = new Map();
// 字体异步加载会改变行高：就绪后清缓存，下次触发时用最终字形重测
// （期间已设的 transform 按旧测量算，偏差在下一次 cue 切换即修正）
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => verseCache.clear());
}
const verseUpdate = (si) => {
  for (const v of verses) {
    let c = verseCache.get(v);
    if (!c) {
      const clip = v.querySelector(".verse-clip");
      c = {clip: clip, accent: clip.getAttribute("data-accent") || "", winH: v.clientHeight, clipH: clip.scrollHeight, lines: []};
      for (const ln of v.querySelectorAll(".verse-line")) {
        c.lines.push({el: ln, top: ln.offsetTop});
      }
      verseCache.set(v, c);
    }
    let act = null;
    for (const L of c.lines) {
      if (parseInt(L.el.getAttribute("data-i"), 10) === si) { act = L; break; }
    }
    for (const L of c.lines) {
      const di = parseInt(L.el.getAttribute("data-i"), 10);
      L.el.classList.toggle("active", L === act);
      // 当前句用段落 accent 着色（字重恒定，避免 500/700 切换时字形宽度
      // 跳变）；非活动行恢复主题色。换色/换透明度在这里是**瞬时**的：
      // 淡入淡出过渡只在人工预览里由 preview.js 注入，成片逐帧 seek 时
      // 每一帧都必须等于时间线时刻（理由见 composition.css 的 verse 块注释）
      L.el.style.color = (L === act && c.accent) ? c.accent : "";
      // past 只在同一 verse（同段落）内比较，跨段句序无先后语义
      L.el.classList.toggle("past", !!act && di < si);
    }
    if (act) {
      // 歌词式滚动：active 行滚到窗口顶部往下 clipPad px（= clip 顶部内边距，
      // 与 .verse-clip 的 padding 保持一致——首句/尾句完整落在 mask 渐隐区
      // 之外，不被边缘虚化）；首行不滚出顶、末行不露底白（clip 比窗口矮时
      // 整体不滚）
      const y = c.clipH <= c.winH ? 0
        : Math.max(c.winH - c.clipH, Math.min(0, 40 - act.top));
      c.clip.style.transform = "translateY(" + y + "px)";
    }
  }
};
// ── verse 句子流驱动（挂在同一个 timeline 的 onUpdate）──────────────────
// 必须留在 verseUpdate 定义之后、时间线注册之前：hyperframes 的 lint 规则按
// 源码位置判定"注册是否早于异步构建"，注册线挪到前面会触发误报（见文件末尾）。
let curCueIdx = -1; // 当前已处理的 cue 下标，避免每帧重复触发
tl.eventCallback("onUpdate", function() {
  const t = tl.time();
  let found = -1;
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i].t && t < cues[i].t + Math.max(cues[i].d, 0.01)) { found = i; break; }
  }
  if (found >= 0) {
    // 用命中的 cue 下标做键，而非 t|d：相邻句的 start 各自 round(,2)
    // 可能坍缩成同一 t，若 d 也相同则键值碰撞，第二条 cue 的高亮永不刷新。
    // 下标天然唯一；verseUpdate 按 si 重设整批 class，重复执行结果一致。
    if (found !== curCueIdx) {
      curCueIdx = found;
      const c = cues[found];
      if (c.si !== undefined && c.si >= 0) verseUpdate(c.si);
    }
  } else {
    // 句间 gap：保持最后一行的状态（高亮停在末句，窗口不回滚）
    curCueIdx = -1;
  }
  if (window.__pvUpdate) window.__pvUpdate(); // 预览刷新钩子（无预览时为空）
});
// 注册放脚本末尾（同步执行流内，行为与紧跟构建后注册等价）：hyperframes 的
// lint 规则按源码位置判定"注册是否早于 document.fonts.ready 异步构建"
// （window.__timelines[ 出现点必须在 fonts.ready 之后）；字幕 JS 里
// Array.from 的 ".from(" 会被规则的 GSAP 补间正则误判，注册线在 fonts.ready
// 之前就会触发 gsap_timeline_registered_before_async_build 误报。
window.__timelines["main"] = tl;

</script>
<script src="preview.js"></script>
</body>
</html>
