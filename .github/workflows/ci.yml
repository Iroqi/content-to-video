name: CI

on:
  push:
    # remotion 是当前的开发分支：漏了它，改 TS 渲染层时 Python 门禁不会跑，
    # 双源分家（缓动幂次表那类）就又会在没人拦的情况下溜过去。
    branches: [main, feature, remotion]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 采样而非全矩阵：下限（SKILL.md 声明的 3.9+）、一个中位、本机开发用的两档
        python: ["3.9", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # 脚本输出含中文；Windows runner 控制台默认 cp1252，直接 print 会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 技能脚本与测试只用标准库：装依赖这一步都不需要，两步命令就是本地维护者的跑法
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        timeout-minutes: 5

      - name: Doc cross-reference check
        run: python tests/check_docs.py

  # 渲染端的门禁：组件与导演求值器是 TS，从前只有人手点开 npx tsc 才知道有没有
  # 坏掉。tests/test_ease_parity.py 已经在 Python 侧钉住缓动双源一致，这里补上
  # 类型检查那一半——两者合起来才等于"过门禁"。
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # generated.ts 是数据胶，由生成器按当次 manifest 产出、不进仓库；渲染端所有
      # 组件都从它 import。先用测试夹具生成一份最小的，tsc 才有完整类型可查。
      - name: Generate data glue for type checking
        working-directory: .
        run: |
          python tests/make_stub_generated.py --out remotion/src/generated.ts

      - run: npm ci
      - run: npx tsc --noEmit -p .
